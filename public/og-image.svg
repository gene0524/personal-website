<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#00ff9d" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#00ff9d" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="photoClip">
      <circle cx="950" cy="315" r="155"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a192f"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Frame -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#00ff9d" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Photo glow halo -->
  <circle cx="950" cy="315" r="240" fill="url(#bgGlow)"/>

  <!-- Top-left tag -->
  <text x="80" y="110" font-family="Menlo, 'Courier New', monospace"
        font-size="22" fill="#00ff9d" letter-spacing="2">// portfolio</text>

  <!-- "Hi, my name is" -->
  <text x="80" y="220" font-family="Menlo, 'Courier New', monospace"
        font-size="26" fill="#8892b0" letter-spacing="3">Hi, my name is</text>

  <!-- Name -->
  <text x="80" y="340" font-family="Menlo, 'Courier New', monospace"
        font-size="110" font-weight="bold" fill="#e6f1ff" letter-spacing="-2">Gene Yu</text>

  <!-- Role with prompt -->
  <g font-family="Menlo, 'Courier New', monospace">
    <text x="80" y="415" font-size="36" fill="#00ff9d" font-weight="bold">&gt;</text>
    <text x="115" y="415" font-size="36" fill="#e6f1ff">Software Engineer</text>
  </g>

  <!-- Description -->
  <text x="80" y="465" font-family="Menlo, 'Courier New', monospace"
        font-size="20" fill="#8892b0">Platform · DevOps · Imperial MSc '24</text>

  <!-- Bottom row -->
  <g font-family="Menlo, 'Courier New', monospace" font-size="22">
    <text x="80" y="565" fill="#8892b0">London · UK</text>
    <text x="1120" y="565" fill="#00ff9d" text-anchor="end">geneyu.me</text>
  </g>

  <!-- Photo (clipped to circle) -->
  <image xlink:href="assets/images/profile/myPhoto.jpg"
         x="795" y="160" width="310" height="310"
         clip-path="url(#photoClip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- Solid green border around photo -->
  <circle cx="950" cy="315" r="156" fill="none" stroke="#00ff9d" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Outer dashed ring -->
  <circle cx="950" cy="315" r="172" fill="none" stroke="#00ff9d" stroke-opacity="0.45"
          stroke-width="1.5" stroke-dasharray="6 8"/>
</svg>
